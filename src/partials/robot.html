<!--
  Robot — drawn, not filmed.

  Shading follows one rule everywhere: light from the upper left. Convex forms
  carry a pale edge on their top-left and a dark edge bottom-right; recesses
  invert it. Contact shadows sit wherever one part passes in front of another.
  Those three cues are what separate a rendered-looking figure from clip art.

  Limbs are several concentric strokes on identical endpoints — a dark shell,
  a mid body, then a thin bright core. That reads as a lit cylinder from any
  angle, which a single linearGradient stroke cannot: a gradient is fixed in
  user space and would shade along the bone's *length* once a limb swings
  horizontal, rather than across its width.

  hero-robot.js writes endpoints to EVERY element sharing a data-bone value —
  arms and both legs are IK chains, so each bone is drawn as a small stack of
  <line> elements that all move together.
-->
<svg
  class="robot"
  viewBox="0 0 440 720"
  fill="none"
  aria-hidden="true"
  preserveAspectRatio="xMidYMax meet"
>
  <defs>
    <linearGradient id="rb-plate" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#4a6ea8" />
      <stop offset=".38" stop-color="#24417a" />
      <stop offset="1" stop-color="#0a1836" />
    </linearGradient>
    <linearGradient id="rb-lit" x1=".1" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#6e91c9" />
      <stop offset=".34" stop-color="#2f4f8f" />
      <stop offset="1" stop-color="#0d1f47" />
    </linearGradient>
    <linearGradient id="rb-deep" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#223b6d" />
      <stop offset="1" stop-color="#070f26" />
    </linearGradient>
    <linearGradient id="rb-visor" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#16305c" />
      <stop offset=".5" stop-color="#0a1730" />
      <stop offset="1" stop-color="#040a18" />
    </linearGradient>
    <radialGradient id="rb-joint" cx=".32" cy=".28">
      <stop offset="0" stop-color="#8aabdc" />
      <stop offset=".55" stop-color="#2b4880" />
      <stop offset="1" stop-color="#0a1836" />
    </radialGradient>
    <radialGradient id="rb-shadow">
      <stop offset="0" stop-color="#03070f" stop-opacity=".85" />
      <stop offset="1" stop-color="#03070f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rb-core">
      <stop offset="0" stop-color="#eaf2ff" />
      <stop offset=".35" stop-color="#8fb0e6" />
      <stop offset="1" stop-color="#8fb0e6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rb-spec" cx=".5" cy=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <ellipse cx="216" cy="676" rx="118" ry="14" fill="url(#rb-shadow)" />

  <g class="robot__body">
    <!-- ===================== LEGS ===================== -->
    <g class="robot__legs" stroke-linecap="round">
      <!-- Far leg: IK chain, pushed back and dimmed for depth. -->
      <g data-leg="far" opacity=".55">
        <line data-bone="f-thigh" x1="248" y1="468" x2="248" y2="556" stroke="#0d1c3d" stroke-width="36" />
        <line data-bone="f-thigh" x1="248" y1="468" x2="248" y2="556" stroke="#1e3665" stroke-width="26" />
        <line data-bone="f-shin" x1="248" y1="556" x2="248" y2="644" stroke="#0d1c3d" stroke-width="29" />
        <line data-bone="f-shin" x1="248" y1="556" x2="248" y2="644" stroke="#1e3665" stroke-width="20" />
        <circle data-joint="f-knee" cx="248" cy="556" r="15" fill="url(#rb-joint)" />
        <g data-joint="f-foot">
          <path d="M-16 0h30a9 9 0 0 1 9 9v9a6 6 0 0 1-6 6h-38a6 6 0 0 1-6-6V9a9 9 0 0 1 9-9z" fill="#10203f" />
        </g>
      </g>

      <!-- Near leg: IK chain, full shading -->
      <g data-leg="near">
        <line data-bone="n-thigh" x1="192" y1="468" x2="192" y2="556" stroke="#0a1730" stroke-width="44" />
        <line data-bone="n-thigh" x1="192" y1="468" x2="192" y2="556" stroke="#22407a" stroke-width="34" />
        <line data-bone="n-thigh" x1="192" y1="468" x2="192" y2="556" stroke="#4d76b5" stroke-width="15" stroke-opacity=".75" />
        <line data-bone="n-thigh" x1="192" y1="468" x2="192" y2="556" stroke="#a9c6f2" stroke-width="4" stroke-opacity=".45" />

        <line data-bone="n-shin" x1="192" y1="556" x2="192" y2="644" stroke="#0a1730" stroke-width="34" />
        <line data-bone="n-shin" x1="192" y1="556" x2="192" y2="644" stroke="#22407a" stroke-width="26" />
        <line data-bone="n-shin" x1="192" y1="556" x2="192" y2="644" stroke="#4d76b5" stroke-width="11" stroke-opacity=".7" />
        <line data-bone="n-shin" x1="192" y1="556" x2="192" y2="644" stroke="#a9c6f2" stroke-width="3" stroke-opacity=".4" />

        <circle data-joint="n-knee" cx="192" cy="556" r="19" fill="url(#rb-joint)" />
        <circle data-joint="n-knee" cx="192" cy="556" r="19" fill="url(#rb-spec)" />

        <g data-joint="n-foot">
          <path d="M-19 0h30a10 10 0 0 1 10 10v8a7 7 0 0 1-7 7h-42a7 7 0 0 1-7-7v-8a10 10 0 0 1 10-10z"
                fill="url(#rb-lit)" stroke="#8fb0e6" stroke-opacity=".45" />
          <path d="M11 6h10a8 8 0 0 1 8 8v3a7 7 0 0 1-7 7h-11z" fill="#16305c" stroke="#8fb0e6" stroke-opacity=".3" />
          <path d="M-26 24h52" stroke="#03070f" stroke-opacity=".55" stroke-width="2.5" />
        </g>
      </g>
    </g>

    <!-- ===================== PELVIS ===================== -->
    <path d="M172 398h96a22 22 0 0 1 22 22v22a38 38 0 0 1-38 38h-64a38 38 0 0 1-38-38v-22a22 22 0 0 1 22-22z"
          fill="url(#rb-plate)" stroke="#7f9ccb" stroke-opacity=".45" />
    <ellipse cx="192" cy="466" rx="24" ry="14" fill="#050d20" fill-opacity=".65" />
    <ellipse cx="248" cy="466" rx="20" ry="12" fill="#050d20" fill-opacity=".55" />
    <path d="M176 400h88" stroke="#bcd4f7" stroke-opacity=".4" stroke-width="2" stroke-linecap="round" />

    <!-- ===================== WAIST ===================== -->
    <g class="robot__waist">
      <rect x="190" y="352" width="60" height="17" rx="8.5" fill="url(#rb-deep)" stroke="#6b8ec6" stroke-opacity=".35" />
      <rect x="186" y="374" width="68" height="19" rx="9.5" fill="url(#rb-deep)" stroke="#6b8ec6" stroke-opacity=".35" />
      <path d="M196 356h48M192 378h56" stroke="#a9c6f2" stroke-opacity=".28" stroke-linecap="round" />
    </g>

    <!-- ===================== CHEST ===================== -->
    <g class="robot__chest">
      <path d="M148 268c0-16 13-26 28-26h88c15 0 28 10 28 26l6 56c2 22-15 38-36 38h-84c-21 0-38-16-36-38z"
            fill="url(#rb-lit)" stroke="#93b3e4" stroke-opacity=".5" stroke-width="1.6" />
      <ellipse cx="164" cy="292" rx="20" ry="34" fill="#050d20" fill-opacity=".3" />
      <ellipse cx="276" cy="292" rx="20" ry="34" fill="#050d20" fill-opacity=".22" />
      <path d="M166 296c18 9 34 11 54 11s36-2 54-11" stroke="#050d20" stroke-opacity=".5" stroke-width="2.5" />
      <path d="M166 299c18 9 34 11 54 11s36-2 54-11" stroke="#a9c6f2" stroke-opacity=".22" />
      <path d="M220 244v118" stroke="#050d20" stroke-opacity=".4" stroke-width="2" />
      <path d="M176 244h88c14 0 24 9 26 22" stroke="#d3e2ff" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round" />
      <circle class="robot__core-halo" cx="220" cy="324" r="34" fill="url(#rb-core)" opacity=".45" />
      <circle cx="220" cy="324" r="19" fill="#050d20" />
      <circle cx="220" cy="324" r="19" stroke="#93b3e4" stroke-opacity=".7" />
      <circle class="robot__core-dot" cx="220" cy="324" r="9" fill="#e6efff" />
      <circle cx="215" cy="319" r="3.5" fill="#ffffff" fill-opacity=".7" />
    </g>

    <!-- ===================== SHOULDERS ===================== -->
    <path d="M148 262a32 32 0 0 1 32-18l-5 50a36 36 0 0 1-34-16z" fill="url(#rb-plate)" stroke="#7f9ccb" stroke-opacity=".45" />
    <path d="M292 262a32 32 0 0 0-32-18l5 50a36 36 0 0 0 34-16z" fill="url(#rb-lit)" stroke="#93b3e4" stroke-opacity=".5" />
    <path d="M262 246a30 30 0 0 1 26 14" stroke="#d3e2ff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round" />
    <circle cx="160" cy="278" r="20" fill="url(#rb-joint)" />
    <circle cx="280" cy="278" r="21" fill="url(#rb-joint)" />
    <circle cx="280" cy="278" r="21" fill="url(#rb-spec)" />

    <!-- ===================== NECK ===================== -->
    <path d="M202 220h36v28h-36z" fill="url(#rb-deep)" />
    <path d="M202 228h36M202 236h36M202 244h36" stroke="#6b8ec6" stroke-opacity=".4" />
    <ellipse cx="220" cy="248" rx="20" ry="6" fill="#050d20" fill-opacity=".5" />

    <!-- ===================== HEAD ===================== -->
    <g class="robot__head">
      <path d="M184 116h72a28 28 0 0 1 28 28v40a30 30 0 0 1-13 25l-15 10a36 36 0 0 1-38 0l-15-10a30 30 0 0 1-13-25v-40a28 28 0 0 1 28-28z"
            fill="url(#rb-lit)" stroke="#93b3e4" stroke-opacity=".55" stroke-width="1.6" />
      <path d="M192 132a24 24 0 0 1 20-10h40" stroke="#e2ecff" stroke-opacity=".5" stroke-width="2.6" stroke-linecap="round" />
      <path d="M170 168v22a26 26 0 0 0 8 18" stroke="#050d20" stroke-opacity=".35" stroke-width="2" />
      <path d="M270 168v22a26 26 0 0 1-8 18" stroke="#050d20" stroke-opacity=".3" stroke-width="2" />
      <!-- brow ridge: the single biggest cue that a head has a face -->
      <path d="M178 148h84a4 4 0 0 1 4 4v4H174v-4a4 4 0 0 1 4-4z" fill="#0d1f47" />
      <path d="M174 157h92" stroke="#a9c6f2" stroke-opacity=".3" />
      <path d="M178 158h84a4 4 0 0 1 4 4v22a12 12 0 0 1-12 12h-68a12 12 0 0 1-12-12v-22a4 4 0 0 1 4-4z"
            fill="url(#rb-visor)" stroke="#5e79a8" stroke-opacity=".5" />
      <path d="M182 163h76" stroke="#8fb0e6" stroke-opacity=".22" />
      <g class="robot__eyes">
        <ellipse class="robot__pupil" data-eye="l" cx="203" cy="169" rx="10" ry="6.5" fill="#dcebff" />
        <ellipse class="robot__pupil" data-eye="r" cx="239" cy="169" rx="10" ry="6.5" fill="#dcebff" />
      </g>
      <!-- Expression overlays: hidden by default, swapped in by hero-robot.js
           on face hover/click rather than replacing the tracking pupils above. -->
      <g class="robot__eyes-heart" aria-hidden="true">
        <!-- Translate lives on the wrapper, not the animated path itself — a
             CSS transform (the heartbeat keyframe) replaces an element's own
             transform attribute wholesale rather than composing with it, so
             a scale animation directly on a translated path would snap it
             back to the SVG origin every frame. -->
        <g transform="translate(203 168)">
          <path class="robot__heart" d="M0-1.5c-1.6-3-6-2.6-6 .6 0 2.4 2.6 4.6 6 6.9 3.4-2.3 6-4.5 6-6.9 0-3.2-4.4-3.6-6-.6z" fill="#eaf2ff" />
        </g>
        <g transform="translate(239 168)">
          <path class="robot__heart" d="M0-1.5c-1.6-3-6-2.6-6 .6 0 2.4 2.6 4.6 6 6.9 3.4-2.3 6-4.5 6-6.9 0-3.2-4.4-3.6-6-.6z" fill="#eaf2ff" />
        </g>
      </g>
      <g class="robot__eyes-angry" aria-hidden="true">
        <rect x="196" y="166.5" width="16" height="5" rx="2.5" fill="#0a1730" transform="rotate(10 204 169)" />
        <rect x="228" y="166.5" width="16" height="5" rx="2.5" fill="#0a1730" transform="rotate(-10 236 169)" />
      </g>
      <g class="robot__brows" aria-hidden="true">
        <path d="M189 155l21 9" stroke="#0a1730" stroke-width="4.5" stroke-linecap="round" />
        <path d="M251 155l-21 9" stroke="#0a1730" stroke-width="4.5" stroke-linecap="round" />
      </g>
      <!-- Invisible hit zone: the only part of the (otherwise click-through)
           robot stage that accepts pointer events, so hover/click gestures
           read as "touching the face" without blocking the rest of the hero. -->
      <ellipse class="robot__face-hit" cx="220" cy="178" rx="72" ry="92" fill="transparent" pointer-events="all" />
      <path d="M196 198h48a7 7 0 0 1 7 7 16 16 0 0 1-16 14h-30a16 16 0 0 1-16-14 7 7 0 0 1 7-7z"
            fill="url(#rb-deep)" stroke="#6b8ec6" stroke-opacity=".4" />
      <path d="M204 205h32M206 211h28" stroke="#8fb0e6" stroke-opacity=".45" stroke-linecap="round" />
      <rect x="166" y="156" width="14" height="30" rx="6" fill="url(#rb-plate)" stroke="#7f9ccb" stroke-opacity=".45" />
      <rect x="260" y="156" width="14" height="30" rx="6" fill="url(#rb-plate)" stroke="#7f9ccb" stroke-opacity=".45" />
      <circle cx="173" cy="171" r="3" fill="#8fb0e6" fill-opacity=".6" />
      <circle cx="267" cy="171" r="3" fill="#8fb0e6" fill-opacity=".6" />
      <path d="M220 116v-24" stroke="#93b3e4" stroke-width="2.6" stroke-linecap="round" />
      <circle class="robot__antenna" cx="220" cy="88" r="6" fill="#e6efff" />
    </g>

    <!-- ===================== LEFT ARM (idles) ===================== -->
    <g class="robot__arm" data-arm="left" stroke-linecap="round">
      <line data-bone="l-upper" x1="160" y1="278" x2="146" y2="366" stroke="#0a1730" stroke-width="30" />
      <line data-bone="l-upper" x1="160" y1="278" x2="146" y2="366" stroke="#1e3768" stroke-width="22" />
      <line data-bone="l-upper" x1="160" y1="278" x2="146" y2="366" stroke="#4d76b5" stroke-width="9" stroke-opacity=".55" />
      <line data-bone="l-fore" x1="146" y1="366" x2="142" y2="446" stroke="#0a1730" stroke-width="24" />
      <line data-bone="l-fore" x1="146" y1="366" x2="142" y2="446" stroke="#1e3768" stroke-width="17" />
      <line data-bone="l-fore" x1="146" y1="366" x2="142" y2="446" stroke="#4d76b5" stroke-width="7" stroke-opacity=".5" />
      <circle data-joint="l-elbow" cx="146" cy="366" r="14" fill="url(#rb-joint)" />
      <g transform="translate(142 446)">
        <path d="M-12 -6h22a11 11 0 0 1 11 11v10a13 13 0 0 1-13 13h-18a13 13 0 0 1-13-13V5a11 11 0 0 1 11-11z"
              fill="url(#rb-plate)" stroke="#7f9ccb" stroke-opacity=".45" />
      </g>
    </g>

    <!-- ===================== RIGHT ARM (IK toward the pointer) ========== -->
    <g class="robot__arm robot__arm--active" data-arm="right" stroke-linecap="round">
      <line data-bone="upper" x1="280" y1="278" x2="298" y2="366" stroke="#0a1730" stroke-width="34" />
      <line data-bone="upper" x1="280" y1="278" x2="298" y2="366" stroke="#22407a" stroke-width="26" />
      <line data-bone="upper" x1="280" y1="278" x2="298" y2="366" stroke="#4d76b5" stroke-width="11" stroke-opacity=".75" />
      <line data-bone="upper" x1="280" y1="278" x2="298" y2="366" stroke="#bcd4f7" stroke-width="3.5" stroke-opacity=".45" />

      <line data-bone="fore" x1="298" y1="366" x2="302" y2="448" stroke="#0a1730" stroke-width="27" />
      <line data-bone="fore" x1="298" y1="366" x2="302" y2="448" stroke="#22407a" stroke-width="20" />
      <line data-bone="fore" x1="298" y1="366" x2="302" y2="448" stroke="#4d76b5" stroke-width="9" stroke-opacity=".7" />
      <line data-bone="fore" x1="298" y1="366" x2="302" y2="448" stroke="#bcd4f7" stroke-width="3" stroke-opacity=".4" />

      <circle data-joint="elbow" cx="298" cy="366" r="15" fill="url(#rb-joint)" />
      <circle data-joint="elbow" cx="298" cy="366" r="15" fill="url(#rb-spec)" />

      <g data-joint="hand-group">
        <g class="robot__hand">
          <circle class="robot__hand-glow" cx="0" cy="0" r="28" fill="#8fb0e6" fill-opacity=".14" />
          <path d="M-13 -13h21a13 13 0 0 1 13 13v11a15 15 0 0 1-15 15h-17a13 13 0 0 1-13-13V0a13 13 0 0 1 11-13z"
                fill="url(#rb-lit)" stroke="#d3e2ff" stroke-opacity=".55" />
          <path d="M-9 -9h16" stroke="#e2ecff" stroke-opacity=".4" stroke-width="2" stroke-linecap="round" />
          <g stroke-linecap="round">
            <path d="M9 -11l15 -7M13 -3l17 -3M13 8l16 4M9 18l13 9" stroke="#0a1730" stroke-width="7" />
            <path d="M9 -11l15 -7M13 -3l17 -3M13 8l16 4M9 18l13 9" stroke="#cfe0ff" stroke-width="3.6" />
            <path d="M-15 3l-10 6" stroke="#0a1730" stroke-width="7" />
            <path d="M-15 3l-10 6" stroke="#cfe0ff" stroke-width="3.6" stroke-opacity=".85" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
